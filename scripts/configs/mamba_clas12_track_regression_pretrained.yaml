# CLAS12 CVT track regression using a frozen pretrained Mamba backbone.
#
# Run this config with BOTH:
#   --usepretrain --pretrained_ckpt /absolute/path/to/backbone.ckpt
#
# The backbone architecture below is matched to Mike-3-particle/ckpt_best.tar
# from its state-dict keys and tensor shapes.

default: &default
  # === CLAS12 data and target statistics ===
  data_root: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_2_raggedmmap/
  data_root_train: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_2_raggedmmap/
  data_root_test: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_2_raggedmmap/
  stat_dir: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/stats
  regression_target_stats: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/stats/regression_target_stats.json
  downstream_dir: ./downstream_log/clas12_track_regression_pretrained
  checkpoint_dir: ./downstream_log/clas12_track_regression_pretrained/checkpoints

  # The training script requires the checkpoint on the command line.  A
  # pretrained_ckpt entry here would currently be overwritten, so it is
  # deliberately not specified in this YAML.

  # === Data configuration ===
  data_version: clas12_cvt
  input_layout: xyz
  serialization: clas12_band_hilbert
  batch_size: 512
  local_batch_size: 128
  valid_batch_size: 128
  local_valid_batch_size: 128
  limit_data: true
  limit_size: 50000
  n_data_idx: 1000000
  n_eval_steps: 200
  num_data_workers: 12
  log_to_screen: true

  # === Sequence / filtering ===
  nleave: 10000000000.0
  order: REP
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  low_thr: 1
  high_thr: 100
  max_gt_classes: 150
  max_tracks: 150

  # These preprocessing choices must match pretraining as well as the input
  # schema.  pos_only is required for the current three-column [x,y,z] data.
  embed_method: pos_only
  pe_method: nerf
  voxelize: false
  space_filling_order: false
  space_filling_curve: z
  return_dict: true
  return_reg: true
  return_reg_test: true
  return_knn_target: false

  # === Compatibility flags ===
  rep_aaai: false
  nexttoken: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  # === Regression-head optimization ===
  # The backbone is evaluated under torch.no_grad(); these settings optimize
  # the downstream regression head only.
  max_epochs: 300
  max_lr: 0.0003
  min_lr: 0.00001
  first_cycle_steps: 3000
  warmup_steps: 300
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  early_stopping_warmup_steps: 20
  grad_clip_value: 0.1
  total_steps: 30000

  # === Pretrained backbone architecture: MUST match the checkpoint ===
  base_dim: 256
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 1
  dropout: 0.1
  mambaversion: mamba1
  group_size: 8
  init_std: 0.025

  # === Regression task / head ===
  model_version: clas12_track_regression_pretrained
  task: mom
  pooling: attention
  regression_loss: mae
  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  use_attention_head: true
  continue_from_best: true

  # Retained for shared trainer compatibility.
  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

clas12_track_regression_pretrained:
  <<: *default
