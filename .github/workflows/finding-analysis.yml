name: Finding analysis CPU regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  finding-analysis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            numpy: 'numpy==1.26.4'
          - python: '3.12'
            numpy: 'numpy>=2,<3'
    name: finding-analysis (Python ${{ matrix.python }}, ${{ matrix.numpy }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU analysis dependencies
        run: python -m pip install "${{ matrix.numpy }}" scipy scikit-learn matplotlib h5py
      - name: Check calibration, pairing and MC metric contracts
        env:
          MPLBACKEND: Agg
        run: >-
          python -m unittest
          train.downstream.tests.test_finding_analysis_tools
          train.downstream.tests.test_finding_analysis_edge_cases
          train.downstream.tests.test_mc_reconstruction_metrics
          train.downstream.tests.test_particle_metadata
          train.downstream.tests.test_checkpoint_units
          train.downstream.tests.test_single_head_residual_plots -v
