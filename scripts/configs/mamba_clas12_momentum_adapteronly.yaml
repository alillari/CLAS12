# Legacy command-name compatibility configuration for downstream momentum
# regression.  train_momentum_regression.py is a wrapper around
# train_track_regression.py; this recipe therefore uses the current v6
# event-segment regression contract.
#
# AdapterOnly means a raw-coordinate, from-scratch baseline: omit
# --usepretrain.  It is not a frozen-backbone adapter run.

# ---------------------------------------------------------------------------
# Shared defaults
# ---------------------------------------------------------------------------
default: &default
  # === v6 event-product paths ===
  # For downstream momentum regression, this directory must contain at least:
  #   features_pretrain/, features_test/
  #   seg_target_pretrain/, seg_target_test/
  #   reg_target_pretrain/, reg_target_test/   <-- must be real momentum targets
  # Optional, if your dataset.py return_dict path uses them:
  #   pid_target_pretrain/, pid_target_test/
  data_root: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  # data_root_train is retained for compatibility; the loader currently uses
  # data_root for the pretrain split.
  data_root_train: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  data_root_test: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  stat_dir: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/stats/
  regression_target_stats: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/stats/regression_target_stats_mom_event_segment_mctrue_min12.json
  downstream_dir: ./downstream_log/clas12_momentum_adapteronly
  checkpoint_dir: ./downstream_log/clas12_momentum_adapteronly/checkpoints

  # === Data configuration ===
  data_version: clas12_cvt
  input_layout: xyz              # our CLAS12 files are raw [x,y,z], no energy column
  serialization: clas12_band_hilbert
  clas12_band_config: calibrated12
  batch_size: 128                  # CLI --train_batch_size overrides this
  local_batch_size: 128
  valid_batch_size: 128
  local_valid_batch_size: 128
  limit_data: true               # train script overrides using --eventnumber
  limit_size: 50000
  n_data_idx: 1000000
  n_eval_steps: 200
  num_data_workers: 4            # easiest stack traces while debugging
  log_to_screen: true

  # === Sequence / filtering ===
  nleave: 10000000000.0
  order: REP
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  low_thr: 1
  high_thr: 100
  max_gt_classes: 150
  max_tracks: 150

  # === CLAS12 3-column path ===
  embed_method: pos_only         # avoids EmbedderAdd/Concat energy-column assumptions
  pe_method: nerf
  voxelize: false                # old TPC voxelizer assumes 4-column E+position path
  space_filling_order: false
  space_filling_curve: z
  return_dict: true
  return_reg: true               # momentum task should receive reg_target from dataset
  return_reg_test: true
  return_knn_target: false
  adapter_sample_mode: event_segment  # one MC-truth segment per regression sample
  segment_target_source: mctrue       # authoritative v6 seg_target labels
  segment_min_clusters: 12            # event_segment: reject truth segments with fewer clusters
  segment_exact_clusters: false       # event_segment: true reproduces strict exactly-12 behavior
  segment_min_truth_purity: 1.0       # COATJAVA candidates: require pure dominant MC truth
  require_reg_target: true

  # === Compatibility flags that some trainers reference ===
  rep_aaai: false
  nexttoken: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  # === Optimization ===
  max_epochs: 300
  max_lr: 0.0003
  min_lr: 0.00001
  first_cycle_steps: 3000
  warmup_steps: 300
  # Set max_optimizer_steps to enable step-oriented training for Optuna.
  max_optimizer_steps: None
  val_interval_steps: 500
  early_stopping_min_steps: 1000
  adapter_weight_decay: 0.0001
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  early_stopping_warmup_steps: 50
  grad_clip_value: 0.1
  total_steps: 30000

  # === Backbone input / regression-head configuration ===
  # For AdapterOnly, the backbone settings below are not used for the forward
  # pass.  For --usepretrain they must match the supplied backbone checkpoint.
  embed_dim: 128
  group_size: 8
  init_std: 0.025
  model_version: clas12_momentum_adapteronly_debug
  num_layers_backbone: 6
  d_state: 16                 # backbone only; regression head fixes d_state=64
  d_conv: 4
  expand: 2
  klen: 3
  dropout: 0.1
  mambaversion: mamba1        # backbone only; regression head is always Mamba2
  task: mom
  pooling: attention           # honored by MambaTrackRegressionHead
  regression_loss: mae

  # The current trainer always builds MambaTrackRegressionHead, with hidden
  # width 256, one Mamba2 layer, d_state=64, d_conv=4, and expand=2.  Those
  # head values are implementation-fixed rather than YAML-tunable.

  # These are backbone/shared-trainer compatibility settings.
  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  continue_from_best: true

  # Track-finding loss weights; retained only for compatibility with shared trainer utilities.
  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

# ---------------------------------------------------------------------------
# First config to run
# ---------------------------------------------------------------------------
clas12_momentum_adapteronly_debug:
  <<: *default

# ---------------------------------------------------------------------------
# Same idea, but with the CLAS12 Hilbert-band ordering enabled.
# Use only after the radius-ordering run can load and train.
# ---------------------------------------------------------------------------
clas12_momentum_adapteronly_hilbert:
  <<: *default
  serialization: clas12_band_hilbert
  space_filling_order: true
