# Standalone frozen-backbone example; see train/WORKED_EXAMPLE.md.
# Set MODEL_YAML, TRAIN_ROOT, CLAS12_PRETRAINED_CKPT and CLAS12_EVAL_DATA_ROOT.
# For AdapterOnly set use_pretrained_backbone: false and pretrained_checkpoint: null.
analysis:
  run_name: finding_seed42
  analysis_tag: finding_seed42
  model_yaml: ${MODEL_YAML:-/path/to/model.yaml}
  model_config: clas12_track_finding_50k_evaluation
  checkpoint: ${TRAIN_ROOT:-/path/to/adapter_study}/finding/checkpoints/adapter.pth
  training_log: ${TRAIN_ROOT:-/path/to/adapter_study}/finding/checkpoints/training.log
  output_dir: ${TRAIN_ROOT:-/path/to/adapter_study}/finding/evaluation
  run_num: seed42
  batch_size: 32
  num_workers: 0
  max_samples: 10000
  use_pretrained_backbone: true
  pretrained_checkpoint: ${CLAS12_PRETRAINED_CKPT:-/path/to/ckpt_best.tar}
  evaluate_coatjava: false
  coatjava_background_label: -1
  background_label: -1
  assignment_option: 2
  assignment_threshold: 0.2
  match_iou_threshold: 0.5
  match_min_purity: 0.5
  match_min_efficiency: 0.5
  target_momentum_scale_to_gev: 0.001
  momentum_bins_gev:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  pt_bins_gev:
  - 0.0
  - 0.1
  - 0.2
  - 0.35
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  save_per_point_predictions: false
