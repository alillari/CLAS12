# Standalone frozen-backbone example; see train/WORKED_EXAMPLE.md.
# Set MODEL_YAML, TRAIN_ROOT, CLAS12_PRETRAINED_CKPT and CLAS12_EVAL_DATA_ROOT.
# For AdapterOnly set use_pretrained_backbone: false and pretrained_checkpoint: null.
analysis:
  run_name: momentum_seed42
  analysis_tag: momentum_seed42
  model_yaml: ${MODEL_YAML:-/path/to/model.yaml}
  model_config: clas12_momentum_50k_evaluation
  checkpoint: ${TRAIN_ROOT:-/path/to/adapter_study}/momentum/checkpoints/adapter.pth
  training_log: ${TRAIN_ROOT:-/path/to/adapter_study}/momentum/checkpoints/training.log
  output_dir: ${TRAIN_ROOT:-/path/to/adapter_study}/momentum/evaluation
  run_num: seed42
  batch_size: 128
  num_workers: 0
  max_samples: 50000
  use_pretrained_backbone: true
  pretrained_checkpoint: ${CLAS12_PRETRAINED_CKPT:-/path/to/ckpt_best.tar}
  include_sample_metadata: true
  sample_metadata_jsonl:
  target_momentum_scale_to_gev: 0.001
  auxiliary_momentum_scale_to_gev: 1.0
  comparison_truth: mctrue_inner_hit
  swingback_enabled: false
  charge_source: metadata_or_positive
  fallback_charge: 1
  momentum_bins_gev:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  delta_p_over_p_bins_gev:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  - 1.75
  - 2.0
  - 2.25
  - 2.5
  - 2.75
  - 3.0
  delta_p_over_p_min_bin_entries: 200
  delta_p_over_p_min_populated_histogram_bins: 8
  delta_p_over_p_histogram_bins: 40
  delta_p_over_p_fit_quantile: 0.98
  delta_theta_bins_gev:
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  - 1.25
  - 1.5
  - 1.75
  - 2.0
  - 2.25
  - 2.5
  - 2.75
  - 3.0
  delta_theta_min_bin_entries: 200
  delta_theta_min_populated_histogram_bins: 8
  delta_theta_histogram_bins: 40
  delta_theta_fit_quantile: 0.98
  theta_bins_deg:
  - 0
  - 20
  - 40
  - 60
  - 80
  - 100
  - 120
  - 140
  - 160
  - 180
  relative_error_tolerances:
  - 0.01
  - 0.05
  - 0.1
  physics_histogram_bins: 100
  physics_plot_quantile: 0.995
  pid_labels:
    0: pion
    1: kaon
    2: proton
    3: electron
    4: other
