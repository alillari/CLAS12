# Mamba Pretraining Configuration
# Anonymized for publication

# Default configuration (shared across all variants)
default: &default
  # === Data Paths (UPDATE THESE) ===
  data_root: /global/cfs/cdirs/m4722/NPFM/data/pp_12M_mmap  # Directory containing features_train, features_test
  stat_dir:  /global/homes/d/dpark1/NPFN/PP_collision/fm4npp/datasets/stats         # Directory with normalization statistics
  checkpoint_dir: /pscratch/sd/d/dpark1/NPFN/test   # Where to save model checkpoints

  # === Data Configuration ===
  data_version: dataset_name
  n_data_idx: 10000000                   # Number of training samples
  limit_data: true
  limit_size: 10000000

  # === legacy (not used) ===
  group_size: 8
  nleave: 1e10
  order: EPR
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  return_reg_test: false
  return_dict: false
  max_gt_classes: 150
  voxelize: true
  space_filling_order: false
  space_filling_curve: z # hilbert
  grad_clip_value: 0.1
  rep_aaai: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  # === Training Configuration ===
  batch_size: 256                        # Global batch size (distributed across GPUs)
  local_batch_size: 16                   # Batch size per GPU (256 / 16 GPUs)
  valid_batch_size: 64
  local_valid_batch_size: 4

  # === Optimization ===
  max_epochs: 10000
  max_lr: 0.0002
  min_lr: 0.00002
  warmup_steps: 1000
  n_eval_steps: 1000
  total_steps: 50000

  # === Model Configuration ===
  base_dim: 256
  embed_dim: 256
  klen: 30                               # Sequence context length
  dropout: 0.1
  init_std: 0.025

  # === Embedding Configuration ===
  embed_method: add                 # or 'concat'
  pe_method: nerf                        # Positional encoding: 'nerf' or 'sinusoidal'

  # === Training Settings ===
  num_data_workers: 8
  log_to_screen: true
  save_version: mamba_pretrain

# ============================================================================
# Mamba 5M Configuration (~4.6M parameters)
# ============================================================================
mamba_5m:
  <<: *default
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 16                            # State space dimension
  d_conv: 4                              # Convolutional kernel size
  expand: 2                              # Expansion factor
  klen: 30
  batch_size: 256
  local_batch_size: 16                   # Adjust based on available GPUs
  valid_batch_size: 64
  local_valid_batch_size: 4
  warmup_steps: 1000
  total_steps: 50000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  save_version: mamba_5m

# ============================================================================
# Mamba2 5M Configuration (~5.1M parameters)
# ============================================================================
mamba2_5m:
  <<: *default
  embed_dim: 256
  num_layers_backbone: 12
  d_state: 128                           # Larger state space for Mamba2
  d_conv: 4
  expand: 2
  headdim: 64                            # Head dimension for Mamba2
  ngroups: 1                             # Number of groups
  klen: 30
  batch_size: 256
  local_batch_size: 16
  valid_batch_size: 64
  local_valid_batch_size: 4
  warmup_steps: 1000
  total_steps: 50000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  save_version: mamba2_5m

# ============================================================================
# Smaller Mamba Configuration for Testing (~1.5M parameters)
# ============================================================================
mamba_small:
  <<: *default
  embed_dim: 128
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 30
  batch_size: 128
  local_batch_size: 8
  valid_batch_size: 32
  local_valid_batch_size: 2
  warmup_steps: 500
  total_steps: 25000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  save_version: mamba_small

# ============================================================================
# CLAS12 Pretraining Configuration
# Adapted from mamba_small for CLAS12 CVT data (no energy, 6 discrete layers,
# ~5-40 hits/event). See CLAS12_CHANGES.md for the full rationale behind each
# changed value.
# ============================================================================
clas12_pretrain:
  <<: *default

  # === Data Paths (container-relative, i.e. as seen inside the docker container) ===
  data_root: /workspace/PP_collision/data/mmap          # features_pretrain / seg_target_pretrain / reg_target_pretrain live here
  stat_dir:  /workspace/PP_collision/data/stats         # dummy loss_bin_pp.pkl / loss_weight_pp.pkl live here
  checkpoint_dir: /workspace/PP_collision/checkpoints   # model checkpoints

  # === CLAS12-specific overrides ===
  klen: 3                       # "reduced space -> next nearest prediction" (was 30)
  embed_method: pos_only        # no energy channel -> EmbedderPosOnly (was 'add')
  voxelize: false               # Voxelizer/HRS removed entirely
  space_filling_order: true     # CLAS12 ordering path (clas12_band_hilbert_order) is primary
  # space_filling_curve is now irrelevant (our function replaces the z/hilbert string flag)

  # === Missing attrs the training loop references but the original yaml omits ===
  # (added explicitly to avoid AttributeError at runtime)
  rep_aaai: false
  nexttoken: false
  ablate_loss_scale: false

  # === Model size: start with the small preset (proportionate to CLAS12's
  #     small, simple data); easily bumped to embed_dim=256 / 12 layers later ===
  embed_dim: 128
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2

  # === Batch / optimization: TPC defaults kept for now (flagged as a tuning
  #     opportunity — CLAS12 events are tiny, larger batches very likely afford) ===
  batch_size: 128
  local_batch_size: 8
  valid_batch_size: 32
  local_valid_batch_size: 2
  warmup_steps: 500
  total_steps: 25000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  n_eval_steps: 1000 #5

  save_version: clas12_pretrain

# ============================================================================
# CLAS12 Straight-Track Baseline (synthetic "easy ceiling" test)
# Identical to clas12_pretrain except data_root points at the synthetic
# perfectly-straight-track data. k=1 to compare directly against run0 (real k=1).
# ============================================================================
clas12_straight:
  <<: *default
  data_root: /workspace/PP_collision/data/mmap_straight
  stat_dir:  /workspace/PP_collision/data/stats
  checkpoint_dir: /workspace/PP_collision/checkpoints
  klen: 1
  embed_method: pos_only
  voxelize: false
  space_filling_order: true
  rep_aaai: false
  nexttoken: false
  ablate_loss_scale: false
  embed_dim: 128
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2
  batch_size: 128
  local_batch_size: 8
  valid_batch_size: 32
  local_valid_batch_size: 2
  warmup_steps: 500
  total_steps: 25000
  max_lr: 0.0002
  min_lr: 0.00002
  dropout: 0.1
  n_eval_steps: 1000
  save_version: clas12_straight




