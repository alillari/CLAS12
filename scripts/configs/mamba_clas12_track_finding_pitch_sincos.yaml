# CLAS12 track-finding: pitch vs pitch+sincos-loss comparison.
# 2 backbones x 3 widths (m1,m4,m6) x 4 label counts = 24 runs.
# Both backbones use embed_method=pos_plus_aux / aux_extra_feature=pitch at
# the DATA level (return_knn_aux_target/use_sincos_target are pretraining-
# loss-only concepts -- irrelevant for downstream use, which never touches
# output_layer at all). Intended for train_track_finding.py --usepretrain.

default: &default
  data_root: /workspace/PP_collision/data/mmap_canonical_loose_truthseg_event_v7_01
  data_root_train: /workspace/PP_collision/data/mmap_canonical_loose_truthseg_event_v7_01
  data_root_test: /workspace/PP_collision/data/mmap_canonical_loose_truthseg_event_v7_01
  stat_dir: /workspace/PP_collision/data/stats
  downstream_dir: ./downstream_log/clas12_track_finding_pitch_sincos_comparison
  checkpoint_dir: ./downstream_log/clas12_track_finding_pitch_sincos_comparison/checkpoints

  data_version: clas12_cvt
  input_layout: xyz
  serialization: clas12_band_hilbert
  batch_size: 64
  local_batch_size: 64
  valid_batch_size: 1
  local_valid_batch_size: 1
  limit_data: true
  limit_size: 50000
  n_data_idx: 1000000
  n_eval_steps: 200
  num_data_workers: 4
  log_to_screen: true

  nleave: 10000000000.0
  order: REP
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  low_thr: 1
  high_thr: 100
  max_gt_classes: 150
  max_tracks: 150

  pe_method: nerf
  voxelize: false
  space_filling_order: false
  space_filling_curve: z
  return_dict: false
  return_reg: false
  return_reg_test: false
  return_knn_target: false

  rep_aaai: false
  nexttoken: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  max_epochs: 60
  max_lr: 0.0003
  min_lr: 0.00001
  first_cycle_steps: 3000
  warmup_steps: 6
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0001
  early_stopping_warmup_steps: 60
  grad_clip_value: 0.1
  total_steps: 30000

  group_size: 8
  init_std: 0.025
  num_layers_backbone: 12
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 1
  dropout: 0.1
  downstream_dropout: 0.1
  mambaversion: mamba1

  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  use_attention_head: true
  continue_from_best: true

  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

clas12_track_finding_pretrained_v701pitch_w64:
  <<: *default
  embed_dim: 64
  base_dim: 64
  model_version: clas12_track_finding_pretrained_v701pitch_w64
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w64
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w64/checkpoints

clas12_track_finding_pretrained_v701pitch_w512:
  <<: *default
  embed_dim: 512
  base_dim: 512
  model_version: clas12_track_finding_pretrained_v701pitch_w512
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w512
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w512/checkpoints

clas12_track_finding_pretrained_v701pitch_w1536:
  <<: *default
  embed_dim: 1536
  base_dim: 1536
  model_version: clas12_track_finding_pretrained_v701pitch_w1536
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w1536
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitch_w1536/checkpoints

clas12_track_finding_pretrained_v701pitchsincos_w64:
  <<: *default
  use_sincos_target: true
  embed_dim: 64
  base_dim: 64
  model_version: clas12_track_finding_pretrained_v701pitchsincos_w64
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w64
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w64/checkpoints

clas12_track_finding_pretrained_v701pitchsincos_w512:
  <<: *default
  use_sincos_target: true
  embed_dim: 512
  base_dim: 512
  model_version: clas12_track_finding_pretrained_v701pitchsincos_w512
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w512
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w512/checkpoints

clas12_track_finding_pretrained_v701pitchsincos_w1536:
  <<: *default
  use_sincos_target: true
  embed_dim: 1536
  base_dim: 1536
  model_version: clas12_track_finding_pretrained_v701pitchsincos_w1536
  embed_method: pos_plus_aux
  pos_dim: 3
  aux_dim: 4
  use_aux_features: true
  aux_extra_feature: pitch
  downstream_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w1536
  checkpoint_dir: ./downstream_log/clas12_track_finding_pretrained_v701pitchsincos_w1536/checkpoints