# ============================================================================
# Post-Optuna full sweeps, kNNN=5, both sincos models. m1-m5 only.
# Recipes from the klen=5 Optuna studies; warmup_steps scaled from the 5k-step
# trial budget to 100k steps, preserving each recipe's tuned warmup ratio.
# Config names carry _klen5 so checkpoints never collide with the kNNN=1 sweep.
# ============================================================================

