# CLAS12 CVT downstream track-finding / AdapterOnly configuration.
# Intended for train_track_finding.py.

default: &default
  data_root: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  data_root_train: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  data_root_test: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/
  stat_dir: /home/alessio/mnt/edgexpert-a02c/ML-work/HIPO_processing/multi_particle_storage/big-data/mmap_canonical_loose_truthseg_event_v6_02/stats/
  artifact_root: ${CLAS12_ARTIFACT_ROOT:-/home/alessio/mnt/edgexpert-a02c/ML-work/result_deep_storage}
  downstream_dir: "{artifact_root}/downstream_log/clas12_track_finding_adapteronly"
  checkpoint_dir: "{downstream_dir}/checkpoints"

  data_version: clas12_cvt
  input_layout: xyz
  serialization: clas12_band_hilbert
  batch_size: 32
  local_batch_size: 32
  valid_batch_size: 32
  local_valid_batch_size: 32
  limit_data: true
  limit_size: 50000
  n_data_idx: 1000000
  n_eval_steps: 200
  num_data_workers: 4
  log_to_screen: true

  nleave: 10000000000.0
  order: REP
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  low_thr: 1
  high_thr: 512
  max_gt_classes: 150
  num_prototypes: 150
  max_tracks: 150
  background_label: -1

  # CLAS12 point tensors are 3-column [eta, phi, r]; the old TPC voxelizer
  # assumes a leading energy column, so CLAS12 ordering is selected via
  # serialization instead.
  embed_method: pos_only
  pe_method: nerf
  voxelize: false
  space_filling_order: false
  space_filling_curve: z
  return_dict: true
  return_reg: false
  return_reg_test: true
  return_knn_target: false
  adapter_sample_mode: track_legacy

  rep_aaai: false
  nexttoken: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  max_epochs: 300
  max_lr: 0.0003
  min_lr: 0.00001
  first_cycle_steps: 3000
  scheduler_first_cycle_steps: 3000
  warmup_steps: 300
  max_optimizer_steps: None
  val_interval_steps: 500
  max_train_batches: None
  max_val_batches: 200
  early_stopping_min_steps: 1000
  early_stopping_patience: 15
  early_stopping_min_delta: 0.0001
  early_stopping_warmup_steps: 60
  adapter_weight_decay: 0.0001
  grad_clip_value: 0.1
  total_steps: 30000

  base_dim: 128
  embed_dim: 128
  group_size: 8
  init_std: 0.025
  model_version: clas12_track_finding_adapteronly
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 3
  dropout: 0.1
  downstream_dropout: 0.1
  mambaversion: mamba1
  num_adapter_layers: 0
  adapter_d_state: 16
  adapter_d_conv: 4
  adapter_expand: 2
  num_self_attn_layers: 2
  do_masked_attn: true
  softmax_mask: false
  assignment_option: 2
  assignment_threshold: 0.0
  match_iou_threshold: 0.5
  match_min_purity: 0.5
  match_min_efficiency: 0.5
  momentum_bins_gev: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0]
  pt_bins_gev: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0]
  target_momentum_scale_to_gev: 0.001

  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  use_attention_head: true
  continue_from_best: true

  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

clas12_track_finding_adapteronly:
  <<: *default
