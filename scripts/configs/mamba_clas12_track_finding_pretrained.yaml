# === AdapterOnly (no pretraining) -- ONE fixed width, matching the
# original adapteronly config's own default. Confirmed from run_table.csv:
# 28 total rows = 4 adapteronly (one per label count) + 24 pretrained
# (6 widths x 4 label counts) -- adapter-only never varied by width.
clas12_track_finding_adapteronly:
  <<: *default
  embed_dim: 128
  base_dim: 128
  model_version: clas12_track_finding_adapteronly
  embed_method: add
  use_aux_features: false
  downstream_dir: ./downstream_log/clas12_track_finding_adapteronly
  checkpoint_dir: ./downstream_log/clas12_track_finding_adapteronly/checkpoints