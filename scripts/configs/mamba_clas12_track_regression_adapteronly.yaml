# CLAS12 CVT downstream track-regression / AdapterOnly debug configuration
# Intended for train_track_regression.py with --usepretrain omitted.

# ---------------------------------------------------------------------------
# Shared defaults
# ---------------------------------------------------------------------------
default: &default
  # === Paths: EDIT THESE ===
  # For downstream track regression, this directory must contain at least:
  #   features_pretrain/, features_test/
  #   seg_target_pretrain/, seg_target_test/
  #   reg_target_pretrain/, reg_target_test/   <-- must be real momentum targets
  # Optional, if your dataset.py return_dict path uses them:
  #   pid_target_pretrain/, pid_target_test/
  data_root: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_1_raggedmmap/
  data_root_train: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_1_raggedmmap/
  data_root_test: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/cvt_ragged_v3_1_raggedmmap/
  stat_dir: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/stats
  regression_target_stats: /home/alessio/ML-work/HIPO_processing/multi_particle_storage/stats/regression_target_stats.json
  downstream_dir: ./downstream_log/clas12_track_regression_adapteronly
  checkpoint_dir: ./downstream_log/clas12_track_regression_adapteronly/checkpoints

  # === Data configuration ===
  data_version: clas12_cvt
  input_layout: xyz              # our CLAS12 files are raw [x,y,z], no energy column
  serialization: clas12_band_hilbert          # safest first debug choice; switch to clas12_band_hilbert later
  batch_size: 128                  # train_track_regression.py overrides this from --train_batch_size
  local_batch_size: 128
  valid_batch_size: 128            # train_momentum_regression.py also forces this to 1
  local_valid_batch_size: 128
  limit_data: true               # train script overrides using --eventnumber
  limit_size: 50000
  n_data_idx: 1000000
  n_eval_steps: 200
  num_data_workers: 4            # easiest stack traces while debugging
  log_to_screen: true

  # === Sequence / filtering ===
  nleave: 10000000000.0
  order: REP
  len_chunk: 512
  portion: 0.2
  chunk_training: false
  low_thr: 1
  high_thr: 100
  max_gt_classes: 150
  max_tracks: 150

  # === CLAS12 3-column path ===
  embed_method: pos_only         # avoids EmbedderAdd/Concat energy-column assumptions
  pe_method: nerf
  voxelize: false                # old TPC voxelizer assumes 4-column E+position path
  space_filling_order: false
  space_filling_curve: z
  return_dict: true
  return_reg: true               # momentum task should receive reg_target from dataset
  return_reg_test: true
  return_knn_target: false

  # === Compatibility flags that some trainers reference ===
  rep_aaai: false
  nexttoken: false
  loss_reweight: false
  ablate_loss_scale: false
  save_checkpoint: true

  # === Optimization ===
  max_epochs: 300
  max_lr: 0.0003
  min_lr: 0.00001
  first_cycle_steps: 3000
  warmup_steps: 300
  grad_clip_value: 0.1
  total_steps: 30000

  # === Model / adapter configuration ===
  base_dim: 128
  embed_dim: 128
  group_size: 8
  init_std: 0.025
  model_version: clas12_track_regression_adapteronly_debug
  num_layers_backbone: 6
  d_state: 16
  d_conv: 4
  expand: 2
  klen: 3
  dropout: 0.1
  mambaversion: mamba1
  task: mom
  pooling: attention

  # These are mostly harmless for track regression; some trainer/model code may still expect them.
  num_heads_backbone: 4
  num_heads_decoder: 2
  num_heads_encoder: 2
  num_embedder_layers: 0
  use_attention_head: true
  continue_from_best: true

  # Track-finding loss weights; retained only for compatibility with shared trainer utilities.
  loss_matched_ce_weight: 0.5
  loss_unmatched_ce_weight: 0.1
  loss_dice_weight: 1
  loss_focal_weight: 30

# ---------------------------------------------------------------------------
# First config to run
# ---------------------------------------------------------------------------
clas12_track_regression_adapteronly_debug:
  <<: *default

# ---------------------------------------------------------------------------
# Same idea, but with the CLAS12 Hilbert-band ordering enabled.
# Use only after the radius-ordering run can load and train.
# ---------------------------------------------------------------------------
clas12_track_regression_adapteronly_hilbert:
  <<: *default
  serialization: clas12_band_hilbert
  space_filling_order: true
